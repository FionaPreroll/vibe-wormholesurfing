name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Codecov checks who uploads with GitHub's OIDC token, so no upload token is needed.
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome ci
      - run: pnpm test:coverage
      # Two reports go to Codecov, each with its flag: the unit tests (here) and the browser
      # tests (below).
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: unit
          # Only the files named: a search would add the other report to this flag.
          disable_search: true
      # With source maps and coverage: see tests/e2e/coverage.ts.
      - run: pnpm build
        env:
          COVERAGE: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          COVERAGE: "1"
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/e2e/lcov.info
          flags: e2e
          disable_search: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
