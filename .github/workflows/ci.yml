name: CI

# The checks and the Android build run side by side; from main, the web version goes live and the
# APK is released only once all of them have passed. The browser tests take most of the time, so
# they run in shards, each on a runner of its own, beside the quick checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Codecov checks who uploads with GitHub's OIDC token, so no upload token is needed.
  id-token: write

jobs:
  # Types, lint and the unit tests: done within a minute, so a mistake there shows at once.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome ci
      - run: pnpm test:coverage
      # Two reports go to Codecov, each with its flag: the unit tests (here) and the browser
      # tests (in every shard below; Codecov merges the uploads of a commit).
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: unit
          # Only the files named: a search would add the other report to this flag.
          disable_search: true

  # The browser tests in shards, each on a runner of its own: two tests at once on one runner
  # starve each other, as each draws 3D in software. Playwright splits them by their number,
  # test by test (`fullyParallel` in playwright.config.ts).
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its failures, not only the first to fail.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With source maps and coverage: see tests/e2e/coverage.ts.
      - run: pnpm build
        env:
          COVERAGE: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          COVERAGE: "1"
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/e2e/lcov.info
          flags: e2e
          disable_search: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # One result for all the checks, under the name the ruleset for main requires and the jobs
  # below wait for. It runs even when one failed, so a failure turns it red, not skipped.
  check:
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo "static: ${{ needs.static.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.e2e.result }}" = success

  # The Android APK, built beside the checks (android.yml).
  apk:
    uses: ./.github/workflows/android.yml

  # The web version goes live from main once the checks, the browser tests and the APK passed.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, apk]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    # Builds of main only, and only once every other job has passed: pull requests and runs on
    # other branches publish nothing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: android-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wormhole-surfing-apk
      - name: Skip if main has moved on, or a newer build is out
        id: current
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          # The build in the release now: a run started later may have finished first, and an
          # older build must not replace it.
          published=$(gh release download "$TAG" --pattern version.json --output - 2>/dev/null |
            node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              try { console.log(Number(JSON.parse(s).build) || 0) } catch { console.log(0) } })')
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head now; its own run publishes that build instead."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "${published:-0}" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "::notice::Build $published is out already, newer than this build $GITHUB_RUN_NUMBER."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        if: steps.current.outputs.publish == 'true'
        run: |
          cat > notes.md <<NOTES
          The newest build of Wormhole Surfing for Android, from commit ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). This release is replaced with every change to \`main\`.

          **Installing:** download \`wormhole-surfing.apk\` below and open it on the phone; Android asks once to allow installing apps from that source. A newer APK installs over an older one and keeps your treasures and settings, and the app can look for a newer build and install it itself (Settings → App updates).

          Every build is signed with the project's own key, which is in the repository so that every build signs alike: it proves only that the APK comes from a build of this project. The app is not on the Play Store.
          NOTES
          # What the app compares with its own build number to find updates (@fionapreroll/app-updates).
          printf '{"build":%s,"commit":"%s","size":%s}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(stat -c %s wormhole-surfing.apk)" > version.json
          # The tag follows main: it always names the commit of the APK in the release.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" wormhole-surfing.apk version.json --clobber
            gh release edit "$TAG" --title "Wormhole Surfing for Android" --notes-file notes.md --latest
          else
            gh release create "$TAG" wormhole-surfing.apk version.json --title "Wormhole Surfing for Android" --notes-file notes.md --latest
          fi
