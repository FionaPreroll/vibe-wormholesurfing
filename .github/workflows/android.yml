name: Android APK

# Builds the Android app (Capacitor) as an installable release APK and keeps it as the run's
# artifact. CI (ci.yml) calls it on every push to main and every pull request, beside its checks;
# from main, CI's release job publishes the APK once every other job has passed, to the release
# "Wormhole Surfing for Android", at a download link that never changes:
# https://github.com/FionaPreroll/vibe-wormholesurfing/releases/latest/download/wormhole-surfing.apk
# The build number is CI's run number, as the run is CI's.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        # The version, the build number and the commit, as Android shows the app's version.
        run: |
          VERSION_NAME="$(node -p "require('../package.json').version")-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" \
            ./gradlew assembleRelease --no-daemon
      - run: mv android/app/build/outputs/apk/release/app-release.apk wormhole-surfing.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wormhole-surfing-apk
          path: wormhole-surfing.apk
          retention-days: 30
          if-no-files-found: error
