# The desktop app for Windows, macOS and Linux (desktop/main.ts): `pnpm desktop:dist` packs it for
# the system it runs on, `pnpm desktop:pack` only unpacked, into desktop/release/.
appId: io.github.fionapreroll.wormholesurfing
productName: Wormhole Surfing
executableName: wormhole-surfing
# Without the version, so the release's download links never change, as the APK's do not.
artifactName: wormhole-surfing-${os}-${arch}.${ext}
directories:
  output: desktop/release
  # icon.png, rendered by `pnpm icons`; electron-builder makes the .icns and .ico from it.
  buildResources: desktop/icons
# The main process and the web build: the game is bundled, and the app needs none of the
# packages it was built from.
files:
  - desktop/build/**
  - dist/**
  - package.json
  - "!node_modules/**"
npmRebuild: false
# Only in the packed app's package.json: Electron names the window after it on Linux.
extraMetadata:
  desktopName: wormhole-surfing.desktop
mac:
  category: public.app-category.games
  # Not signed with a Developer ID, so not notarized: macOS asks the player to allow it once.
  # Signed ad hoc ("-") instead: Apple silicon runs nothing unsigned, and an app whose signature
  # broke when it was packed is called damaged, with no way to allow it. The hardened runtime is
  # for notarized apps; with an ad-hoc signature it would keep Electron's libraries from loading.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Game
  # The name of the .desktop entry, which the window carries as its WM_CLASS, so desktops show the
  # running game under its launcher.
  syncDesktopName: true
  target:
    - AppImage
    - tar.gz
